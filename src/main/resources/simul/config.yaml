agentVersion: ">=__AGENT_VERSION__"
app: your.app.package   # TODO: set the application id under test
llm:
  url: http://localhost:8080   # OpenAI-compatible endpoint: local llama-server or a hosted API
  model: qwen                  # model name sent with every request
  # apiKey: ${OPENAI_API_KEY}  # endpoints that need a key: ${VAR} reads the environment —
  #                            # never a literal here (this file is committed). Without this
  #                            # line SIMUL_LLM_API_KEY is used when set.
defaults:
  maxTurns: 12
  scrollLimit: 3
display:
  sizeClass: small   # small=720x1280@320(360dp) | medium(640dp) | large(1066dp)
# context: |         # what the model cannot see on screen — appended to every session's system prompt.
#   A subscription video app. Guests and non-subscribers may meet a login or subscription
#   wall on play, library and comments; payment goes to the Google Play sheet.
#                    # Facts only. Never "tapping play must open the wall": expectations belong
#                    # to the scenario's Verify steps — written here they let a regression pass as normal.
# states:            # who each `.simul/states/<name>` is — the scenario's own line joins its prompt
#   guest: not signed in
#   member: signed in, subscribed
# device:            # what every scenario assumes of the device (a scenario that needs the opposite declares the same block under its own `setup:`)
#   locale: ko-KR    # the app's language (Android 13+ per-app locale, `cmd locale set-app-locales`) — set in each setup after the
#                    # pm clear that wipes it, restored when the scenario ends; the system language is never touched
#   settings:        # emulator `settings` (read → put only if different → restored on exit)
#     secure.credential_service: ""              # no credential provider → no "Use your saved password" sheet
#     secure.credential_service_primary: ""
#     secure.autofill_service: null              # null = `settings delete` (key unset)
#     secure.immersive_mode_confirmations: confirmed
